[project]
name = "sommbench"
version = "0.1.2"
description = "Should you trust AI(LLM) sommelier?"
readme = "README.md"
authors = [{ name = "William Brach" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "litellm[caching]>=1.75.0",
    "pandas>=2.3.1",
    "pycountry>=24.6.1",
    "scikit-learn>=1.7.2",
    "typer>=0.17.4",
    "openpyxl>=3.1.5",
    "datasets>=4.8.2",
    "multiprocess>=0.70.19",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.10.6",
    "seaborn>=0.13.2",
]
dev = [
    "black>=25.9.0",
    "dspy>=2.6.27",
    "ipykernel>=7.0.0",
    "ipywidgets>=8.1.7",
    "ruff>=0.14.0",
    "ty>=0.0.1a21",
    "pytest>=8.0",
    "huggingface-hub>=1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"



[project.scripts]
sommbench = "sommbench.cli:app"


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring a running LM Studio instance",
]

[tool.ty.environment]
python = ".venv"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "models.py"
]


# Same as Black.
line-length = 88
target-version = "py312"


[tool.ruff.lint]
#https://beta.ruff.rs/docs/rules/
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "G",
    "SIM1",
    "PLE",
    "N802", "N803", "N815", "N816","N806",
    "ANN",
    "C901",
    "UP",  # pyupgrade,
    "PLR0915"
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "G004",
    "ANN101",
    "ANN003",
    "B904",
    "ANN401"
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]
